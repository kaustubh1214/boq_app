workflows:
  android-demo:
    name: AV BOQ Android demo
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate the Android project files
        script: |
          flutter create --platforms=android --org in.avgroup --project-name boq_app .
          rm -rf test
          rm -f analysis_options.yaml
          sed -i.bak 's/android:label="[^"]*"/android:label="AV BOQ"/' android/app/src/main/AndroidManifest.xml
          rm -f android/app/src/main/AndroidManifest.xml.bak
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
