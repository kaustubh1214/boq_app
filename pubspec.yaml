name: boq_app
description: AV Group BOQ and material management - Android app for the live AV BOQ web app.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  mobile_scanner: ^6.0.0
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  share_plus: ^10.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FAF9F6"
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
